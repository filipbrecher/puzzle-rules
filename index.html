<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

.sts{display:flex;flex-direction:column;gap:10px}

.tag.tv{color:#8a5a00;background:#fbf0d4}.cmp b.variant{font-weight:500;font-style:italic}

@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:42% 1fr}aside{border-right:0;border-bottom:1px solid var(--ln)}}
</style></head><body>
<header>
<h1>Puzzle rules</h1><nav id="tabs"></nav>
<span id="st"></span><button id="gh">GitHub</button><button id="sv" class="pri" hidden>Save to GitHub</button><button id="imp">Import zip</button><button id="exp">Export zip</button>

<main>
<aside><div class="srch"><input id="q" type="search" placeholder="Search names and rules"><button id="new" class="pri">New</button></div><div id="flt"></div><div id="list"></div></aside>
<section id="ed"></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const CATS=[["number","Number"],["path","Path"],["shading","Shading"],["object","Object"],["region","Region"],["word","Word"],["other","Other"]];
const KEY="puzzle-rules-v1",DEFL=[{code:"en",label:"English",base:true},{code:"ja",label:"日本語"},{code:"cs",label:"Čeština"}];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let SAVED=null;try{SAVED=JSON.parse(localStorage.getItem(KEY))}catch(e){}
let S={languages:DEFL,genres:{},variants:{},appearances:{},dirty:false};
let tab="genres",sel=null,q="",F={},armDel=null,armImp=false;const openInfo=new Set();
const langs=()=>S.languages.map(l=>l.code);
const base=()=>(S.languages.find(l=>l.base)||S.languages[0]).code;
const kind=()=>tab==="genres"?"g":tab==="variants"?"v":"a";
const coll=()=>S[tab];
const persist=()=>{if(A())try{localStorage.setItem(KEY,JSON.stringify({...S,commit:G.commit,pend:G.pend}))}catch(e){}status()};
const save=()=>{S.dirty=true;persist()};
const nid=o=>String(Math.max(0,...Object.keys(o).map(Number).filter(Number.isFinite))+1);
const rid=()=>"a_"+Math.random().toString(36).slice(2,8);
const catLbl=c=>(CATS.find(x=>x[0]===c)||[0,""])[1];
const cget=c=>(c.type==="genre"?S.genres:S.variants)[c.id];
const words=s=>s.toLowerCase().split(/\s+/).filter(Boolean);
const fams=e=>e.families||(e.family?[e.family]:[]);
function sortComps(a){const L=c=>lbl(cget(c)||{},c.type[0]);return a.sort((x,y)=>(x.type===y.type?0:x.type==="genre"?-1:1)||L(x).localeCompare(L(y)))}
const sts=(e,l)=>(e.rules?.[l]?.statements||[]).filter(s=>s.trim());
function clean(e){if(!e||!e.rules)return;for(const l in e.rules)if(e.rules[l]?.statements)e.rules[l].statements=e.rules[l].statements.map(s=>s.trim()).filter(Boolean)}
const usedBy=(ty,id)=>Object.values(S.appearances).filter(a=>(a.components||[]).some(c=>c.type===ty&&c.id===id));
const grow=t=>{t.style.height="auto";t.style.height=t.scrollHeight+"px"};
const cnt=l=>{$("#n_"+l).textContent=sts(coll()[sel],l).length+" statements"};
function renderCol(l,f,pos){const r=coll()[sel].rules[l];if(!r.statements.length)r.statements.push("");
 const b=$("#s_"+l);b.innerHTML=r.statements.map((s,i)=>`<div class="st"><span class="n">${i+1}</span><textarea rows="1" data-sl="${l}" data-si="${i}">${esc(s)}</textarea></div>`).join("");
 const ts=b.querySelectorAll("textarea");ts.forEach(grow);
 if(f!=null){const t=ts[f];if(t){t.focus();const q=pos??t.value.length;t.setSelectionRange(q,q)}}}
function flash(t){$("#st").textContent=t;setTimeout(status,6000)}
const gp=location.hostname.endsWith(".github.io")?{owner:location.hostname.split(".")[0],repo:location.pathname.split("/")[1]||""}:{};
const REPO={owner:"",repo:"",branch:"main"}; // set once: your GitHub account name, repository name and branch
const C=Object.assign({branch:""},JSON.parse(localStorage.getItem("pzr-gh")||"{}"),gp,REPO.owner?REPO:{});
let G={mode:"view",commit:"",base:{},imgs:new Set(),pend:{}},imgT=null;
const TOK=()=>sessionStorage.getItem("pzr-tok")||localStorage.getItem("pzr-tok")||"";
const A=()=>G.mode==="admin",J=o=>JSON.stringify(o,null,2);
const raw=(ref,p)=>`https://raw.githubusercontent.com/${C.owner}/${C.repo}/${ref}/${p}`;
const imgUrl=p=>G.pend[p]?G.pend[p].url:raw(A()?G.commit:C.branch,p);
async function api(p,o={}){const hd={Accept:"application/vnd.github+json"};if(TOK())hd.Authorization="Bearer "+TOK();if(o.body)hd["Content-Type"]="application/json";
 const r=await fetch(`https://api.github.com/repos/${C.owner}/${C.repo}${p?"/"+p:""}`,{...o,headers:hd,body:o.body&&JSON.stringify(o.body)});
 if(!r.ok)throw Error((await r.json().catch(()=>({}))).message||r.status);return r.json()}
async function pull(ref){const f=async p=>{const r=await fetch(raw(ref,p));if(!r.ok)throw Error(p+" "+r.status);return r.json()};
 const ix=await f("data/index.json"),n={languages:await f("data/languages.json"),genres:{},variants:{},appearances:{},dirty:false};
 await Promise.all([...ix.genres.map(x=>["genres",x.id]),...ix.variants.map(x=>["variants",x.id])].map(async([t,id])=>{n[t][id]=await f(`data/${t}/${id}.json`)}));
 (await f("data/appearances.json")).forEach(a=>n.appearances[a.id]=a);Object.values(n.variants).forEach(mig);return n}
function files(){const o={},cl=e=>{const c=JSON.parse(JSON.stringify(e));clean(c);return c};
 o["data/languages.json"]=J(S.languages);
 for(const t of["genres","variants"])Object.values(S[t]).forEach(e=>o[`data/${t}/${e.id}.json`]=J(cl(e)));
 o["data/appearances.json"]=J(Object.values(S.appearances).map(a=>({...a,components:sortComps([...(a.components||[])])})));
 o["data/index.json"]=J({schemaVersion:1,genres:Object.values(S.genres).map(e=>({id:e.id,names:e.names})),variants:Object.values(S.variants).map(e=>({id:e.id,names:e.names}))});return o}
async function connect(){const rp=await api("");if(rp.permissions&&rp.permissions.push===false)throw Error("This token cannot write to the repo");
 G.commit=(await api(`git/ref/heads/${C.branch}`)).object.sha;
 G.imgs=new Set((await api(`git/trees/${G.commit}?recursive=1`)).tree.filter(x=>x.type==="blob"&&x.path.startsWith("images/")).map(x=>x.path));
 let n;try{n=await pull(G.commit)}catch(e){if(!/404/.test(e.message))throw e}
 S=n||{languages:DEFL,genres:{},variants:{},appearances:{},dirty:false};sel=null;G.base=n?files():{};G.pend={};
 if(SAVED&&SAVED.dirty&&SAVED.commit===G.commit){const{commit,pend,...s}=SAVED;S=s;G.pend=pend||{}}SAVED=null;G.mode="admin"}
async function load(){if(!C.branch)C.branch=(await api("")).default_branch;
 if(TOK())await connect();else{S=await pull(C.branch);sel=null;G.mode="view"}}
function parseRepo(s){const m=s.trim().replace(/\.git$/,"").match(/(?:github\.com[\/:])?([\w.-]+)\/([\w.-]+)(?:\/tree\/([^\/\s]+))?/);return m?{owner:m[1],repo:m[2],branch:m[3]||""}:null}
const hint=e=>/Bad credentials/.test(e.message)?"GitHub rejected the token (wrong, expired, or no access to this repo).":/404|Not Found/.test(e.message)?"Not found. Check the repository link and branch. For a new repo, an admin must save once to create the data files.":e.message;
const cmsg=(t,c)=>{$("#c-msg").textContent=t;$("#c-msg").className="msg "+c};
async function ghSave(){
 if((await api(`git/ref/heads/${C.branch}`)).object.sha!==G.commit)throw Error("The repo changed since you loaded it. Reconnect first (export a zip as backup).");
 const f=files(),ent=[],used=new Set();
 Object.values(S.genres).forEach(g=>(g.examples||[]).forEach(x=>[x.problem,x.solution].forEach(q=>q&&used.add(q))));
 const blob=async(path,content,encoding)=>{const b=await api("git/blobs",{method:"POST",body:{content,encoding}});ent.push({path,mode:"100644",type:"blob",sha:b.sha})},jobs=[];
 for(const[q,c]of Object.entries(f))if(G.base[q]!==c)jobs.push(blob(q,c,"utf-8"));
 for(const q in G.base)if(!(q in f))ent.push({path:q,mode:"100644",type:"blob",sha:null});
 for(const q in G.pend)if(used.has(q))jobs.push(blob(q,G.pend[q].b64,"base64"));
 for(const q of G.imgs)if(!used.has(q))ent.push({path:q,mode:"100644",type:"blob",sha:null});
 await Promise.all(jobs);if(!ent.length)return flash("Nothing to save.");
 const cm=await api(`git/commits/${G.commit}`),tr=await api("git/trees",{method:"POST",body:{base_tree:cm.tree.sha,tree:ent}});
 const nc=await api("git/commits",{method:"POST",body:{message:C.msg||"Update puzzle rules",tree:tr.sha,parents:[G.commit]}});
 await api(`git/refs/heads/${C.branch}`,{method:"PATCH",body:{sha:nc.sha}});
 for(const q in G.pend)if(used.has(q))G.imgs.add(q);G.imgs=new Set([...G.imgs].filter(q=>used.has(q)));
 G.commit=nc.sha;G.base=f;G.pend={};S.dirty=false;persist();flash("Saved to GitHub")}
function toWebp(file){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);
 c.toBlob(b=>{const r=new FileReader();r.onload=()=>res({url:r.result,b64:r.result.split(",")[1]});r.readAsDataURL(b)},"image/webp",.9)};i.onerror=rej;i.src=URL.createObjectURL(file)})}
async function setImg(f){const e=coll()[sel],x=e.examples[imgT.i];
 try{const r=await toWebp(f),q=`images/${e.id}/${x.id}-${imgT.s}-${rid().slice(2,6)}.webp`;delete G.pend[x[imgT.s]];G.pend[q]=r;x[imgT.s]=q;save();editor()}catch(err){flash("Could not read that image")}}
function applyMode(){const ro=!A();document.body.classList.toggle("ro",ro);$("#sv").hidden=!A();
 if(ro){document.querySelectorAll("#ed input,#ed textarea").forEach(x=>x.readOnly=true);document.querySelectorAll("#ed select,#ed input[type=checkbox]").forEach(x=>x.disabled=true)}}
function editor(){editor0();applyMode()}
async function boot(){if(!C.owner||!C.repo)return;try{await load()}catch(e){flash("GitHub: "+hint(e))}render()}
function norm(e,k){e.names=e.names||{};e.rules=e.rules||{};e.inventor=e.inventor||{name:"",link:"",note:""};e.notes=e.notes||"";
 langs().forEach(l=>{e.names[l]=e.names[l]||[];const r=e.rules[l]=e.rules[l]||{};r.statements=r.statements||[];r.source=r.source||{text:"",link:""}});
 if(k==="v"){e.families=fams(e);delete e.family;mig(e)}else e.category=e.category||"";return e}
function nm(e){const b=e.names?.[base()]||[];if(b.length)return b.join(" / ");for(const l of langs()){const n=(e.names?.[l]||[])[0];if(n)return n}return""}
function snip(e){const s=sts(e,base())[0]||langs().map(l=>sts(e,l)[0]).find(Boolean)||"";return s.length>70?s.slice(0,70)+"…":s}
const au=a=>a.author??a.by??"";
function mig(v){if(!v.kind){v.kind="general";v.category=(v.categories||[]).length===1?v.categories[0]:"all"}if(v.kind==="general"&&!v.category)v.category="all";delete v.categories;return v}
const scopeT=v=>v.kind==="specific"?(S.genres[v.genre]?nm(S.genres[v.genre])||"Unnamed genre":"?"):(v.category&&v.category!=="all"?catLbl(v.category):"All");
const scopeH=v=>v.kind==="specific"?`<span class="g">${esc(scopeT(v))}</span>`:`<span class="c">${esc(scopeT(v))}</span>`;
function lbl(e,k){if(k==="a")return(e.components||[]).map(c=>{const x=cget(c);return x?lbl(x,c.type[0]):"?"}).join(" + ");
 return k==="g"?nm(e)||"Unnamed genre":(nm(e)||"Unnamed variant")+" ("+scopeT(e)+")"}
function lblH(e,k){if(k==="a")return(e.components||[]).map(c=>{const x=cget(c);return x?lblH(x,c.type[0]):"?"}).join(" + ");
 return k==="g"?`<span class="g">${esc(nm(e)||"Unnamed genre")}</span>`:`<span class="v">${esc(nm(e)||"Unnamed variant")}</span> (${scopeH(e)})`}
function wscore(e,w){let s=0;
 for(const l of langs())for(const n of e.names?.[l]||[]){const x=n.toLowerCase();s=Math.max(s,x===w?5:x.startsWith(w)?4:x.includes(w)?3:0)}
 if(fams(e).some(f=>f.toLowerCase().includes(w)))s=Math.max(s,2);
 for(const l of langs())for(const t of sts(e,l))if(t.toLowerCase().includes(w))s=Math.max(s,1);
 const g=e.kind==="specific"?S.genres[e.genre]:null;if(g&&nm(g).toLowerCase().includes(w))s=Math.max(s,2);
 return s}
function sc(e,ws){if(!ws.length)return 1;let tot=0;for(const w of ws){const s=wscore(e,w);if(!s)return 0;tot+=s}return tot}
function items(){const k=kind(),ws=words(q);
 let a=Object.values(coll()).map(e=>({e,s:k==="a"?(ws.every(w=>(lbl(e,"a")+" "+(e.link||"")+" "+au(e)+" "+(e.note||"")).toLowerCase().includes(w))?1:0):sc(e,ws)})).filter(x=>x.s>0);
  if(F.c)a=a.filter(x=>k==="g"?x.e.category===F.c:x.e.kind==="specific"?S.genres[x.e.genre]?.category===F.c:(!x.e.category||x.e.category==="all"||x.e.category===F.c));
 if(F.r)a=a.filter(x=>!sts(x.e,F.r).length);
 if(F.n)a=a.filter(x=>F.n==="*"?langs().every(l=>!(x.e.names?.[l]||[]).length):!(x.e.names?.[F.n]||[]).length);
 if(F.f)a=a.filter(x=>fams(x.e).includes(F.f));
 return a.sort((x,y)=>y.s-x.s||lbl(x.e,k).localeCompare(lbl(y.e,k))).map(x=>x.e)}
function meta(e,k){

 if(k==="g"){h+=card("Examples",(e.examples||[]).map((x,i)=>`<div class="ex"><div class="row">${["problem","solution"].map(s=>{const im=x[s]?`<img src="${esc(imgUrl(x[s]))}" alt="${s}" loading="lazy">`:`<small>${A()?"Click, paste or drop an image":"No image"}</small>`;
